name: EduConnect CI Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Workspace Dependencies
        run: |
          npm install
          cd backend && npm install
          cd ../frontend && npm install

      - name: Test Frontend Production Build
        run: |
          cd frontend
          npm run build
        env:
          VITE_API_URL: "http://localhost:5000"
          VITE_FIREBASE_API_KEY: "dummy_key"
          VITE_FIREBASE_AUTH_DOMAIN: "dummy_domain"
          VITE_FIREBASE_PROJECT_ID: "dummy_project"
          VITE_FIREBASE_STORAGE_BUCKET: "dummy_bucket"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "123456"
          VITE_FIREBASE_APP_ID: "1:123456:web:123456"
          VITE_ADMIN_UID: "dummy_admin_uid"
